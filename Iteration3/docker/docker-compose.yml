name: iteration3
services:
  follower1:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: follower
      FOLLOWER_DELAY: PT2S
    ports:
      - "8081:8080"

  follower2:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: follower
      FOLLOWER_DELAY: PT1S
    ports:
      - "8082:8080"

  leader:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: leader
      LEADER_FOLLOWER_URLS_0: "http://follower1:8080"
      LEADER_FOLLOWER_URLS_1: "http://follower2:8080"
    ports:
      - "8080:8080"

networks:
  default:
    name: iteration3-network
